spring.application.name=springCore
<?xml version="1.0" encoding="UTF-8"?>
<beans xmlns="http://www.springframework.org/schema/beans"
  xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
  xsi:schemaLocation="
       http://www.springframework.org/schema/beans 
       http://www.springframework.org/schema/beans/spring-beans.xsd">

    <bean id="blackpen" class="com.example.beans.BlackPen"/>

    <bean id="fountainpen" class="com.example.beans.FountainPen">
        <constructor-arg ref="blackpen"/>
    </bean>

    <bean id="writer" class="com.example.beans.Writer">
        <constructor-arg ref="fountainpen"/>
    </bean>

</beans>
